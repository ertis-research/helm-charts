{{- if include "mlflow.s3.createSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mlflow.s3.secretName" . }}
  labels:
    {{- include "mlflow.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.artifacts.s3.accessKeyKey }}: {{ .Values.artifacts.s3.accessKey | b64enc | quote }}
  {{ .Values.artifacts.s3.secretKeyKey }}: {{ .Values.artifacts.s3.secretKey | b64enc | quote }}
{{- end }}
