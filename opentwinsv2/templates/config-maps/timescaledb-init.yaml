apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "opentwinsv2.fullname" . }}-timescaledb-init
  labels:
    {{- include "opentwinsv2.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
data:
  data-table.sql: |-
{{ .Files.Get "scripts/data-table.sql" | indent 4 }}
  events-table.sql: |-
{{ .Files.Get "scripts/events-table.sql" | indent 4 }}
  things-table.sql: |-
{{ .Files.Get "scripts/things-table.sql" | indent 4 }}