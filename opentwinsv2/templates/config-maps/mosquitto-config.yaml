{{- if .Values.mosquitto.enabled }}

apiVersion: v1
kind: ConfigMap
metadata:
  name: opentwinsv2-mosquitto-config
  labels:
    {{- include "opentwinsv2.labels" . | nindent 4 }}
data:
  mosquitto.conf: |
    listener 1883
    allow_anonymous true
    persistence true
    persistence_location /mosquitto/data/

{{- end }}