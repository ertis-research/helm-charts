apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "opentwinsv2.fullname" . }}-dapr-restart
  labels:
    {{- include "opentwinsv2.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    metadata:
      labels:
        {{- include "opentwinsv2.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "opentwinsv2.fullname" . }}-opentwinsv2-sa
      restartPolicy: Never
      containers:
        - name: kubectl
          image: bitnami/kubectl:latest
          command:
            - "sh"
            - "-c"
            - |
              sleep 10
              kubectl rollout restart deployment {{ include "opentwinsv2.fullname" . }}-events
              kubectl rollout restart deployment {{ include "opentwinsv2.fullname" . }}-things
              kubectl rollout restart deployment {{ include "opentwinsv2.fullname" . }}-twins
              kubectl rollout restart deployment {{ include "opentwinsv2.fullname" . }}-orchestration