apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "opentwinsv2.fullname" . }}-opentwinsv2-namespace-binding
  labels:
    {{- include "opentwinsv2.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "opentwinsv2.fullname" . }}-opentwinsv2-sa
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "opentwinsv2.fullname" . }}-opentwinsv2-manager-role
  apiGroup: rbac.authorization.k8s.io