apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opentwinsv2.fullname" . }}-postgresql-connection-string
  labels:
    {{- include "opentwinsv2.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- /* 1. Use explicit connection string if provided in values */}}
  {{- if .Values.opentwinsv2.connectionString }}
  postgresql-connection-string: {{ .Values.opentwinsv2.connectionString | quote }}
  
  {{- /* 2. Fallback to dynamically building the string if TimescaleDB is enabled */}}
  {{- else if .Values.timescaledb.enabled }}
  
  {{- /* Resolve the database hostname, accounting for potential Helm overrides */}}
  {{- $host := printf "%s-timescaledb" .Release.Name }}
  {{- if .Values.timescaledb.fullnameOverride }}
    {{- $host = .Values.timescaledb.fullnameOverride }}
  {{- else if .Values.timescaledb.nameOverride }}
    {{- $host = printf "%s-%s" .Release.Name .Values.timescaledb.nameOverride }}
  {{- end }}
  
  {{- /* Retrieve port with a 5432 fallback */}}
  {{- $port := .Values.timescaledb.service.port | default 5432 }}
  
  {{- /* Set default TimescaleDB credentials and database name */}}
  {{- $user := "postgres" }}
  {{- $pass := .Values.timescaledb.auth.postgresPassword }}
  {{- $db := "postgres" }}
  
  {{- /* Construct the final connection string */}}
  postgresql-connection-string: {{ printf "Host=%s;Port=%v;Database=%s;Username=%s;Password=%s;" $host $port $db $user $pass | quote }}
  
  {{- /* 3. Fail deployment if no valid configuration is found */}}
  {{- else }}
  {{- fail "Deployment failed: You must either provide connectionString or set timescaledb.enabled to true." }}
  {{- end }}