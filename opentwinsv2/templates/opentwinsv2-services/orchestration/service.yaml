apiVersion: v1
kind: Service
metadata:
  name: {{ include "opentwinsv2.fullname" . }}-orchestration
  labels:
    {{- include "opentwinsv2.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestration
spec:
  type: {{ .Values.opentwinsv2.orchestration.service.type | default "ClusterIP" }}
  selector:
    {{- include "opentwinsv2.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: orchestration
  ports:
    - port: {{ .Values.opentwinsv2.orchestration.service.port | default 80 }}
      targetPort: {{ .Values.opentwinsv2.orchestration.service.targetPort | default 8080 }}
      protocol: TCP
      {{- if and .Values.opentwinsv2.orchestration.service.nodePort (eq (.Values.opentwinsv2.orchestration.service.type | default "ClusterIP") "NodePort") }}
      nodePort: {{ .Values.opentwinsv2.orchestration.service.nodePort }}
      {{- end }}