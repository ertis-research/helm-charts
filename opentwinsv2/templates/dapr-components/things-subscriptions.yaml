apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: {{ include "opentwinsv2.fullname" . }}-thing-update-sub
  labels:
    {{- include "opentwinsv2.labels" . | nindent 4 }}
spec:
  pubsubname: {{ include "opentwinsv2.fullname" . }}-kafka-pubsub
  topic: update-things
  routes:
    default: /internal/create
scopes:
  - {{ .Values.opentwinsv2.things.dapr.appId | default (printf "%s-things-service" (include "opentwinsv2.fullname" .)) | quote }}
---
apiVersion: dapr.io/v2alpha1
kind: Subscription
metadata:
  name: {{ include "opentwinsv2.fullname" . }}-thing-delete-sub
  labels:
    {{- include "opentwinsv2.labels" . | nindent 4 }}
spec:
  pubsubname: {{ include "opentwinsv2.fullname" . }}-kafka-pubsub
  topic: delete-things
  routes:
    default: /internal/delete
scopes:
  - {{ .Values.opentwinsv2.things.dapr.appId | default (printf "%s-things-service" (include "opentwinsv2.fullname" .)) | quote }}