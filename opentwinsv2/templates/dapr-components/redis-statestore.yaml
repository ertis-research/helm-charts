apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: {{ include "opentwinsv2.fullname" . }}-redis-statestore
  labels:
    {{- include "opentwinsv2.labels" . | nindent 4 }}
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: "{{ .Release.Name }}-redis.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.redis.service.port }}"