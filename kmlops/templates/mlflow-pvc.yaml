{{- if and .Values.mlflow.enabled .Values.mlflow.persistence.enabled (not .Values.mlflow.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "kmlops.mlflow.claimName" . }}
  labels:
    {{- include "kmlops.mlflow.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.mlflow.persistence.accessModes | nindent 4 }}
  {{- with .Values.mlflow.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.mlflow.persistence.size | quote }}
{{- end }}
