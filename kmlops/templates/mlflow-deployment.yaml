{{- if .Values.mlflow.enabled }}
{{- $fullName := include "kmlops.mlflow.fullname" . }}
{{- $s3Endpoint := printf "%s://%s" (ternary "https" "http" (eq (include "kmlops.minio.secure" .) "true")) (include "kmlops.minio.endpoint" .) }}
{{- $allowedHosts := list $fullName (printf "%s:*" $fullName) (printf "%s.%s" $fullName .Release.Namespace) (printf "%s.%s:*" $fullName .Release.Namespace) (printf "%s.%s.svc" $fullName .Release.Namespace) (printf "%s.%s.svc:*" $fullName .Release.Namespace) "localhost" "localhost:*" }}
{{- $allowedHosts = concat $allowedHosts .Values.mlflow.extraAllowedHosts | uniq }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "kmlops.mlflow.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    # The SQLite volume is ReadWriteOnce and SQLite allows a single writer.
    type: Recreate
  selector:
    matchLabels:
      {{- include "kmlops.mlflow.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.mlflow.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "kmlops.mlflow.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      {{- with .Values.mlflow.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Creates the artifacts bucket if it does not exist, retrying while the object storage starts.
        - name: create-bucket
          image: "{{ .Values.mlflow.image.repository }}:{{ .Values.mlflow.image.tag }}"
          imagePullPolicy: {{ .Values.mlflow.image.pullPolicy }}
          {{- with .Values.mlflow.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - python
            - -c
            - |
              import os, sys, time
              import boto3
              from botocore.exceptions import ClientError

              bucket = os.environ["MLFLOW_ARTIFACTS_BUCKET"]
              s3 = boto3.client("s3", endpoint_url=os.environ["MLFLOW_S3_ENDPOINT_URL"])
              for attempt in range(60):
                  try:
                      try:
                          s3.head_bucket(Bucket=bucket)
                          print("Bucket " + bucket + " already exists")
                      except ClientError as error:
                          if error.response.get("Error", {}).get("Code") not in ("404", "NoSuchBucket"):
                              raise
                          s3.create_bucket(Bucket=bucket)
                          print("Bucket " + bucket + " created")
                      sys.exit(0)
                  except Exception as error:
                      print("Waiting for the object storage: " + str(error), flush=True)
                      time.sleep(5)
              sys.exit(1)
          env:
            {{- include "kmlops.mlflow.s3Env" (dict "endpoint" $s3Endpoint "context" .) | nindent 12 }}
      containers:
        - name: mlflow
          image: "{{ .Values.mlflow.image.repository }}:{{ .Values.mlflow.image.tag }}"
          imagePullPolicy: {{ .Values.mlflow.image.pullPolicy }}
          {{- with .Values.mlflow.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: ["mlflow"]
          args:
            - server
            - --host=0.0.0.0
            - --port=5000
            - --backend-store-uri=sqlite:////mlflow/mlflow.db
            - --serve-artifacts
            - --artifacts-destination=s3://{{ .Values.mlflow.artifactsBucket }}/
            {{- with .Values.mlflow.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          env:
            {{- include "kmlops.mlflow.s3Env" (dict "endpoint" $s3Endpoint "context" .) | nindent 12 }}
            - name: MLFLOW_SERVER_ALLOWED_HOSTS
              value: {{ join "," $allowedHosts | quote }}
            {{- with .Values.mlflow.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.mlflow.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.mlflow.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.mlflow.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /mlflow
      volumes:
        - name: data
          {{- if .Values.mlflow.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "kmlops.mlflow.claimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.mlflow.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mlflow.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mlflow.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
