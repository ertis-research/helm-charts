{{- if include "kmlops.createSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kmlops.secretName" . }}
  labels:
    {{- include "kmlops.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if and (not .Values.minio.enabled) (not .Values.externalMinio.existingSecret) }}
  minio-access-key: {{ .Values.externalMinio.accessKey | b64enc | quote }}
  minio-secret-key: {{ .Values.externalMinio.secretKey | b64enc | quote }}
  {{- end }}
  {{- if and (eq (include "kmlops.databaseBackend" .) "postgres") (not .Values.postgres.enabled) (not .Values.externalPostgresql.existingSecret) }}
  postgres-password: {{ .Values.externalPostgresql.password | b64enc | quote }}
  {{- end }}
{{- end }}
