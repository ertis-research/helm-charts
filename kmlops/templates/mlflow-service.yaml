{{- if .Values.mlflow.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kmlops.mlflow.fullname" . }}
  labels:
    {{- include "kmlops.mlflow.labels" . | nindent 4 }}
spec:
  type: {{ .Values.mlflow.service.type }}
  ports:
    - port: {{ .Values.mlflow.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "kmlops.mlflow.selectorLabels" . | nindent 4 }}
{{- end }}
