apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "kmlops.fullname" . }}-test-connection"
  labels:
    {{- include "kmlops.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['-qO-', '{{ include "kmlops.fullname" . }}:{{ .Values.service.port }}/']
  restartPolicy: Never
